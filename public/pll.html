<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arc UI - Pure Minimalist</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #F5F5F7; }

        .fullscreen-container {
            width: 100vw; height: 100vh; position: relative;
            background: #F5F5F7;
            display: flex; flex-direction: column; align-items: center; color: #1D1D1F; z-index: 1;
        }

        .header { margin-top: calc(20px + env(safe-area-inset-top)); font-size: 17px; font-weight: 600; color: #1D1D1F; letter-spacing: -0.5px; }
        .title { position: absolute; top: 10vh; font-size: 56px; font-weight: 700; letter-spacing: -1.5px; color: #1D1D1F; text-shadow: 0 4px 20px rgba(0, 0, 0, 0.04); }
        /* RTK 连接状态副标题: 位于 Arc 标题下方 (顶部小字, FaceTime 风格) */
        .subtitle {
            position: absolute;
            top: calc(10vh + 72px);
            font-size: 13px;
            font-weight: 500;
            color: #86868B;
            letter-spacing: -0.1px;
            display: flex; align-items: center; gap: 6px;
            opacity: 0; transform: translateY(-4px);
            transition: opacity 0.4s ease, transform 0.4s ease, color 0.3s ease;
            pointer-events: none;
        }
        .subtitle.visible { opacity: 1; transform: translateY(0); }
        .subtitle .conn-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: #86868B;
            transition: background 0.3s ease;
        }
        .subtitle.connecting .conn-dot { background: #FF9F0A; animation: livePulse 1.0s ease-in-out infinite; }
        .subtitle.live .conn-dot       { background: #34C759; animation: livePulse 1.6s ease-in-out infinite; }
        .subtitle.error .conn-dot      { background: #FF3B30; }
        .subtitle.live   { color: #1D1D1F; }
        .subtitle.error  { color: #FF3B30; }
        .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; padding-bottom: 5vh; }

        .hero-container {
            position: relative; width: 280px; height: 280px;
            display: flex; justify-content: center; align-items: center;
            overflow: visible;
            /* 3D 透视: 让 .face-3d 的 rotateX/Y/Z 有真实的近大远小效果 */
            perspective: 900px;
            perspective-origin: 50% 50%;
        }

        .face-layer {
            position: absolute; z-index: 3; width: 140px; height: 110px;
            animation: breathing 4s ease-in-out infinite;
            cursor: grab;
            overflow: visible;
            /* 保留 3D 上下文, 让子元素的 rotateX/Y/Z 不被 breathing 的 transform 拍扁 */
            transform-style: preserve-3d;
        }

        /* 头部 3D 朝向的旋转层 (跟随真人头部 yaw/pitch/roll) */
        .face-3d {
            width: 100%; height: 100%;
            transform-style: preserve-3d;
            transform-origin: 50% 55%;
            will-change: transform;
        }

        /* overflow:visible 让被拖出 viewBox 的眼/嘴依然能在屏幕任何位置渲染 */
        .face-layer svg {
            width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none;
            overflow: visible;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.08));
        }

        @keyframes breathing { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8px) scale(1.02); } }

        .eye-rect { animation: swiftBlink 4.5s infinite; transform-origin: center; }
        @keyframes swiftBlink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.05); } }

        body.face-tracking-active .eye-rect { animation: none; }
        body.grabbing .face-layer { animation: none; cursor: grabbing; }
        body.grabbing { user-select: none; -webkit-user-select: none; }

        .bubble-container { position: absolute; top: 65vh; display: flex; flex-direction: column; align-items: center; }
        .bubble-dot { width: 10px; height: 10px; background-color: rgba(255,255,255,0.9); border-radius: 50%; margin-bottom: 5px; margin-left: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.06); }
        .speech-bubble {
            background-color: rgba(255, 255, 255, 0.7); backdrop-filter: blur(25px) saturate(180%); -webkit-backdrop-filter: blur(25px) saturate(180%);
            color: #1D1D1F; padding: 14px 32px; border-radius: 30px; font-size: 18px; font-weight: 600; letter-spacing: -0.3px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06), inset 0 0 0 1px rgba(255,255,255,0.5);
            transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .bubble-pop { animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        @keyframes popIn { 0% { transform: scale(0.8) translateY(10px); opacity: 0; } 100% { transform: scale(1) translateY(0px); opacity: 1; } }

        .controls {
            width: 100%; max-width: 420px; padding: 0 30px calc(40px + env(safe-area-inset-bottom)) 30px;
            display: flex; justify-content: space-between; align-items: flex-start; position: absolute; bottom: 0; z-index: 10;
        }
        .control-btn-wrapper { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .btn {
            width: 76px; height: 76px; border-radius: 50%; border: none; display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        .btn:active { transform: scale(0.9); }
        .btn-speaker { background-color: #ffffff; color: #1D1D1F; box-shadow: 0 10px 25px rgba(0,0,0,0.06); transition: background 0.25s ease, color 0.25s ease; }
        .btn-speaker.muted { background-color: #1D1D1F; color: #fff; }
        .btn-end { background-color: #FF3B30; color: white; box-shadow: 0 10px 25px rgba(255, 59, 48, 0.2); }
        .btn-react {
            background-color: rgba(255, 255, 255, 0.6); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
            color: #1D1D1F; border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .label { font-size: 13px; font-weight: 500; color: #86868B; letter-spacing: -0.2px; }

        .face-track-btn {
            position: absolute;
            top: calc(20px + env(safe-area-inset-top));
            right: 20px;
            z-index: 30;
            display: flex; align-items: center; gap: 6px;
            padding: 8px 14px;
            border-radius: 100px;
            border: none;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            box-shadow: 0 6px 18px rgba(0,0,0,0.06), inset 0 0 0 1px rgba(255,255,255,0.6);
            color: #1D1D1F;
            font-size: 13px; font-weight: 600; letter-spacing: -0.2px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        .face-track-btn:active { transform: scale(0.94); }
        .face-track-btn.active { background: #1D1D1F; color: #fff; box-shadow: 0 8px 20px rgba(0,0,0,0.18); }
        .face-track-btn .dot { width: 7px; height: 7px; border-radius: 50%; background: #86868B; }
        .face-track-btn.active .dot { background: #FF3B30; animation: livePulse 1.6s ease-in-out infinite; }
        .face-track-btn.loading .dot, .face-track-btn.calibrating .dot { background: #FF9F0A; animation: livePulse 1.0s ease-in-out infinite; }
        @keyframes livePulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        .cam-preview {
            position: absolute;
            top: calc(70px + env(safe-area-inset-top));
            right: 20px;
            width: 110px; height: 82px;
            border-radius: 14px;
            overflow: hidden;
            z-index: 29;
            background: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15), inset 0 0 0 1px rgba(255,255,255,0.5);
            opacity: 0;
            transform: translateY(-8px) scale(0.9);
            pointer-events: none;
            cursor: pointer;
            transition: opacity 0.3s ease,
                        transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                        width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                        height 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                        border-radius 0.3s ease,
                        background 0.3s ease;
        }
        .cam-preview.visible { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
        .cam-preview video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); transition: opacity 0.25s ease; }
        .cam-preview .calib-ring {
            position: absolute; inset: 0; border: 3px solid #FF9F0A;
            border-radius: 14px; opacity: 0; pointer-events: none;
        }
        .cam-preview.calibrating .calib-ring { opacity: 1; animation: calibPulse 1.0s ease-in-out infinite; }
        @keyframes calibPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 159, 10, 0.5); }
            50% { box-shadow: 0 0 0 10px rgba(255, 159, 10, 0); }
        }

        /* 摄像头预览里的手骨架 canvas (跟视频一样左右镜像) */
        .cam-preview canvas {
            position: absolute; inset: 0; width: 100%; height: 100%;
            pointer-events: none;
            transform: scaleX(-1);
            transition: opacity 0.25s ease;
        }
        /* 缩小态: 隐藏视频/骨架, 留一个 44px 圆形相机图标按钮 */
        .cam-preview .cam-mini-icon {
            position: absolute; inset: 0;
            width: 50%; height: 50%; margin: auto;
            color: #1D1D1F;
            opacity: 0; pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .cam-preview.minimized {
            width: 44px; height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            box-shadow: 0 6px 20px rgba(0,0,0,0.12), inset 0 0 0 1px rgba(255,255,255,0.6);
        }
        .cam-preview.minimized video,
        .cam-preview.minimized canvas { opacity: 0; }
        .cam-preview.minimized .calib-ring { display: none; }
        .cam-preview.minimized .cam-mini-icon { opacity: 0.92; }

        /* 主视图里的手势 SVG: 米老鼠手套风格 (白手套 + 黑描边 + 3 道针脚 + 袖口) */
        #hand-layer {
            position: absolute; inset: 0;
            pointer-events: none; z-index: 18;
            overflow: hidden;
        }
        .hand-svg {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.25s ease, transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: visible;
        }
        .hand-svg.visible { opacity: 1; }
        .hand-svg path { stroke-linecap: round; stroke-linejoin: round; }

        /* 第一层: 黑色粗描边 已透明化 (边缘由 drop-shadow 提供); 仅捏合时染红可见 */
        .hand-svg .outline {
            fill: none;
            stroke: transparent;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.18s ease;
        }
        /* 手掌: 纯白填充 */
        .hand-svg .palm-shape {
            fill: #ffffff;
            stroke: none;
        }
        /* 第二层: 白色笔触 (现在是唯一可见的手指主体) */
        .hand-svg .fill {
            fill: none;
            stroke: #ffffff;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.18s ease;
        }
        /* 手主体: 多层 drop-shadow 在白色边缘外形成柔和阴影, 替代原本的黑描边 */
        .hand-svg .hand-body {
            filter:
                drop-shadow(0 0 0.6px rgba(0, 0, 0, 0.55))
                drop-shadow(0 2px 4px rgba(0, 0, 0, 0.22))
                drop-shadow(0 8px 22px rgba(0, 0, 0, 0.12));
        }


        .reaction-drawer {
            position: absolute; bottom: -55vh; left: 0; width: 100%; height: 50vh;
            background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(40px) saturate(200%); -webkit-backdrop-filter: blur(40px) saturate(200%);
            border-top: 1px solid rgba(255,255,255,0.8); border-radius: 36px 36px 0 0;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.06);
            z-index: 20; transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1);
            padding: 16px 20px calc(20px + env(safe-area-inset-bottom)) 20px;
            display: flex; flex-direction: column;
        }
        .reaction-drawer.open { transform: translateY(-55vh); }
        .drawer-handle { width: 40px; height: 5px; background: rgba(0,0,0,0.15); border-radius: 5px; margin: 0 auto 24px auto; }

        .svg-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(55px, 1fr));
            gap: 15px; overflow-y: auto; flex: 1; padding-bottom: 20px;
        }
        .svg-grid::-webkit-scrollbar { display: none; }

        .svg-btn {
            background: rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.02);
            border-radius: 18px; padding: 10px; cursor: pointer; transition: all 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
            display: flex; justify-content: center; align-items: center;
        }
        .svg-btn:active { transform: scale(0.85); background: rgba(0,0,0,0.08); }
        .svg-btn svg { width: 100%; height: auto; }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.15); z-index: 19; opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        .overlay.active { opacity: 1; pointer-events: auto; }

        #particle-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 15; overflow: hidden; }
        .floating-svg {
            position: absolute; bottom: 120px; width: 60px; height: 60px;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1));
            animation: floatUp var(--duration) cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        @keyframes floatUp {
            0% { transform: translate(0, 0) scale(0.2); opacity: 0; }
            10% { transform: translate(var(--tx-mid), -10vh) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx-end), -80vh) scale(0.8); opacity: 0; }
        }
    </style>
    <!-- Cloudflare RealtimeKit Core SDK (CDN). 不依赖 UI Kit, 用现有自定义 UI 驱动. -->
    <script src="https://cdn.jsdelivr.net/npm/@cloudflare/realtimekit@latest/dist/browser.js"></script>
</head>
<body>

<div class="fullscreen-container">
    <div class="header">9:41</div>
    <div class="title">Arc</div>
    <div class="subtitle" id="rtk-status">
        <span class="conn-dot"></span>
        <span id="rtk-status-text">Solo</span>
    </div>
    <div id="particle-container"></div>

    <button class="face-track-btn" id="face-track-btn">
        <span class="dot"></span>
        <span id="face-track-label">Track Face</span>
    </button>
    <div class="cam-preview" id="cam-preview">
        <video id="cam-video" autoplay muted playsinline></video>
        <canvas id="cam-canvas" width="220" height="164"></canvas>
        <div class="calib-ring"></div>
        <!-- 缩小态下显示的相机图标; 点击整个 cam-preview 切换缩放 -->
        <svg class="cam-mini-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
            <circle cx="12" cy="13" r="3.5"/>
        </svg>
    </div>

    <div id="hand-layer">
        <!-- 极简手套: 每根手指从腕点辐射而出 (一笔成形); Vision OS 模糊渐出 -->
        <svg class="hand-svg" id="hand-svg-0" width="100%" height="100%" preserveAspectRatio="none">
            <defs>
                <!-- ① 不透明渐变: 控制手指区域完全可见, 腕部开始衰减 -->
                <linearGradient id="hfg-0" gradientUnits="userSpaceOnUse" x1="0" y1="600" x2="0" y2="300">
                    <stop offset="0%"   stop-color="white" stop-opacity="0"/>
                    <stop offset="50%"  stop-color="white" stop-opacity="0.75"/>
                    <stop offset="100%" stop-color="white" stop-opacity="1"/>
                </linearGradient>
                <mask id="hfm-0" maskUnits="userSpaceOnUse">
                    <rect x="-9999" y="-9999" width="99999" height="99999" fill="url(#hfg-0)"/>
                </mask>
                <!-- ② Vision OS 腕部模糊滤镜: 大 stdDeviation 制造柔焦晕散 -->
                <filter id="hbf-0" x="-200%" y="-200%" width="500%" height="500%" color-interpolation-filters="sRGB">
                    <feGaussianBlur stdDeviation="20"/>
                </filter>
            </defs>
            <!-- 主手体: 不透明遮罩 + 多层 drop-shadow 阴影边缘 -->
            <g class="hand-body" mask="url(#hfm-0)">
                <path class="palm-shape"></path>
                <path class="outline thumb-outline"></path>
                <path class="outline index-outline"></path>
                <path class="outline middle-outline"></path>
                <path class="outline ring-outline"></path>
                <path class="outline pinky-outline"></path>
                <path class="fill thumb-fill"></path>
                <path class="fill index-fill"></path>
                <path class="fill middle-fill"></path>
                <path class="fill ring-fill"></path>
                <path class="fill pinky-fill"></path>
            </g>
            <!-- Vision OS 腕部光晕: 背景色模糊椭圆, 覆盖腕以下, 柔化消融边界 -->
            <ellipse class="wrist-glow" fill="#F5F5F7" filter="url(#hbf-0)" opacity="0.96"/>
        </svg>
        <svg class="hand-svg" id="hand-svg-1" width="100%" height="100%" preserveAspectRatio="none">
            <defs>
                <linearGradient id="hfg-1" gradientUnits="userSpaceOnUse" x1="0" y1="600" x2="0" y2="300">
                    <stop offset="0%"   stop-color="white" stop-opacity="0"/>
                    <stop offset="50%"  stop-color="white" stop-opacity="0.75"/>
                    <stop offset="100%" stop-color="white" stop-opacity="1"/>
                </linearGradient>
                <mask id="hfm-1" maskUnits="userSpaceOnUse">
                    <rect x="-9999" y="-9999" width="99999" height="99999" fill="url(#hfg-1)"/>
                </mask>
                <filter id="hbf-1" x="-200%" y="-200%" width="500%" height="500%" color-interpolation-filters="sRGB">
                    <feGaussianBlur stdDeviation="20"/>
                </filter>
            </defs>
            <g class="hand-body" mask="url(#hfm-1)">
                <path class="palm-shape"></path>
                <path class="outline thumb-outline"></path>
                <path class="outline index-outline"></path>
                <path class="outline middle-outline"></path>
                <path class="outline ring-outline"></path>
                <path class="outline pinky-outline"></path>
                <path class="fill thumb-fill"></path>
                <path class="fill index-fill"></path>
                <path class="fill middle-fill"></path>
                <path class="fill ring-fill"></path>
                <path class="fill pinky-fill"></path>
            </g>
            <ellipse class="wrist-glow" fill="#F5F5F7" filter="url(#hbf-1)" opacity="0.96"/>
        </svg>
    </div>

    <div class="main-content">
        <div class="hero-container">
            <div class="face-layer" id="face-container">
                <div class="face-3d" id="face-3d">
                    <svg id="face-svg" width="100%" height="100%" viewBox="0 0 100 80">
                        <g id="eye-left"><rect class="eye-rect" x="25" y="10" width="10" height="30" rx="5" fill="#1D1D1F" style="transform-origin: 30px 25px;"/></g>
                        <g id="eye-right"><rect class="eye-rect" x="65" y="10" width="10" height="30" rx="5" fill="#1D1D1F" style="transform-origin: 70px 25px;"/></g>
                        <path id="mouth" d="M 15 55 Q 50 85 85 55" fill="none" stroke="#1D1D1F" stroke-width="10" stroke-linecap="round" />
                    </svg>
                </div>
            </div>
        </div>
        <div class="bubble-container">
            <div class="bubble-dot"></div>
            <div class="speech-bubble bubble-pop" id="speech-text">React!</div>
        </div>
    </div>

    <div class="controls">
        <div class="control-btn-wrapper">
            <button class="btn btn-speaker" onclick="triggerExpression('smile', 'Smooth!')"><svg fill="currentColor" viewBox="0 0 24 24" width="30" height="30"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></button>
            <span class="label">Speaker</span>
        </div>
        <div class="control-btn-wrapper">
            <button class="btn btn-end"><svg fill="currentColor" viewBox="0 0 24 24" width="34" height="34"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg></button>
            <span class="label">End</span>
        </div>
        <div class="control-btn-wrapper">
            <button class="btn btn-react" id="react-btn">

                    <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path>
                </svg>
            </button>
            <span class="label">React</span>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="reaction-drawer" id="reaction-drawer">
        <div class="drawer-handle"></div>
        <div class="svg-grid" id="svg-grid"></div>
    </div>
</div>

<script>
    /* =========================================
       原表情数据集
       ========================================= */
    const states = {

        'laugh':       { p: [15,45,50,95,85,45], l: [0,0,1,0.8,0], r: [0,0,1,0.8,0], t: "Haha!" },
